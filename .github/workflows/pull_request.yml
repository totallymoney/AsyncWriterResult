name: Pull Request
on: pull_request

env:
  SLN_FILE: AsyncWriterResult.sln
  CONFIG: Release

jobs:
  pull_request:
    strategy:
      matrix:
        # Builds for Ubuntu, Windows, and macOS
        os: [ubuntu-latest, windows-latest, macOS-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x.x"
          cache: true
          cache-dependency-path: paket.lock

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet paket restore

      - name: Build
        run: dotnet fsi build.fsx
